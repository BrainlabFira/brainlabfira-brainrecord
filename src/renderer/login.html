<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainlabrecord</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: transparent;   /* la ventana es frameless + transparent */
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Contenedor glass a pantalla completa de la ventana */
    .glass {
      position: relative;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(0, 0, 0, 0.85);          /* negro opacidad 0.85 */
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      color: #f5f5f5;
      -webkit-app-region: drag;                 /* toda la ventana arrastrable */
    }

    /* Barra superior mínima: solo el botón de cerrar */
    .titlebar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
      -webkit-app-region: drag;
    }

    .close-btn {
      -webkit-app-region: no-drag;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

    .card {
      -webkit-app-region: no-drag;   /* los campos deben poder recibir foco/click */
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    .logo svg { width: 30px; height: 30px; stroke: rgba(255,255,255,0.75); }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 28px;
      text-align: center;
    }

    .field {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      padding: 8px 2px;
      margin-bottom: 20px;
      transition: border-color 0.15s;
    }
    .field:focus-within { border-color: rgba(255, 255, 255, 0.7); }
    .field svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.5); flex-shrink: 0; }

    /* Solo los campos de texto: con `input` a secas esta regla alcanzaba
       también al checkbox de recordar y le daba flex:1, dejándolo sin tamaño
       propio. */
    .field input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f5f5f5;
      font-size: 14px;
    }
    .field input::placeholder { color: rgba(255, 255, 255, 0.35); }

    /* Casilla propia, en el mismo lenguaje que los campos: línea fina, blanco
       translúcido y transiciones suaves. La nativa de Windows desentona. */
    .remember {
      -webkit-app-region: no-drag;
      width: 100%;
      display: flex; align-items: center; gap: 9px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      margin: -4px 0 6px;
      transition: color 0.15s;
      user-select: none;
    }
    .remember:hover { color: rgba(255, 255, 255, 0.7); }

    /* La casilla real se oculta pero SIGUE EN EL FLUJO: con position:absolute
       el selector de hermano adyacente (+ .check) deja de aplicarse y el tic
       nunca aparecía. */
    .remember input {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      width: 0; height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .check {
      width: 15px; height: 15px;
      flex: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .check svg {
      width: 9px; height: 9px;
      stroke: #0d0d10;
      stroke-width: 3.5;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .remember:hover .check { border-color: rgba(255, 255, 255, 0.45); }
    .remember input:checked + .check {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(255, 255, 255, 0.85);
    }
    .remember input:checked + .check svg { opacity: 1; }
    /* Visible al navegar con teclado, que si no la casilla no se sabe dónde está. */
    .remember input:focus-visible + .check {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
    }

    button.submit {
      width: 100%;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 12px;
      transition: background 0.15s, border-color 0.15s;
    }
    button.submit:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255,255,255,0.35); }
    button.submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      width: 100%;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.4);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 12.5px;
      margin-top: 14px;
      padding: 9px 12px;
      display: none;
      text-align: center;
    }

  </style>
</head>
<body>
  <div class="glass">
    <div class="titlebar">
      <button class="close-btn" id="closeBtn" title="Cerrar">&#10005;</button>
    </div>

    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="3.5" fill="rgba(255,255,255,0.75)" stroke="none"></circle>
        </svg>
      </div>

      <h1>BrainlabRecord</h1>
      <p class="subtitle">Introduce tus credenciales</p>

      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z"></path><path d="m4 6 8 6 8-6"></path>
        </svg>
        <input type="email" id="email" placeholder="Email" autocomplete="username" />
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" />
      </div>

      <!-- Solo el email. La contraseña es la de la intranet, no solo la de
           esta app: guardarla aquí daría acceso a todo lo del empleado a
           cualquiera que entre en el equipo. -->
      <label class="remember">
        <input type="checkbox" id="rememberEmail" />
        <span class="check">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </span>
        <span>Recordar mi email</span>
      </label>

      <button class="submit" id="loginBtn">Iniciar sesión</button>

      <div class="error" id="errorMsg"></div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const { createClient } = require('@supabase/supabase-js');

    const SUPABASE_URL = process.env.SUPABASE_URL;
    const SUPABASE_ANON_KEY = process.env.SUPABASE_ANON_KEY;

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');

    // ── Recordar el email ──
    // Solo el email, nunca la contraseña: esta es la de la intranet y
    // guardarla daría acceso a todo lo del empleado a cualquiera que entre
    // en el equipo. localStorage basta — es un dato que no es secreto.
    const rememberBox = document.getElementById('rememberEmail');
    const SAVED_EMAIL = 'brainlabrecord.email';

    try {
      const saved = localStorage.getItem(SAVED_EMAIL);
      if (saved) {
        emailInput.value = saved;
        rememberBox.checked = true;
        // Con el email puesto, el cursor va directo a la contraseña.
        passwordInput.focus();
      } else {
        emailInput.focus();
      }
    } catch { /* localStorage no disponible: se escribe a mano */ }

    // Desmarcar borra lo guardado en el momento, sin esperar al próximo login.
    rememberBox.addEventListener('change', () => {
      if (!rememberBox.checked) {
        try { localStorage.removeItem(SAVED_EMAIL); } catch { /* ignorar */ }
      }
    });

    // Botón cerrar (la ventana no tiene frame nativo) — oculta la ventana, la app
    // sigue viva en la bandeja.
    document.getElementById('closeBtn').addEventListener('click', () => {
      ipcRenderer.send('window-close');
    });

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Introduce email y contraseña');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Conectando...';
      errorMsg.style.display = 'none';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error || !data.session) {
        showError(error?.message ?? 'Credenciales incorrectas');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Iniciar sesión';
        return;
      }

      // Credenciales válidas: ya se puede recordar el email. Se hace aquí y no
      // al final para que valga también si el usuario no está en public.users
      // (así no tiene que volver a teclearlo al reintentar).
      try {
        if (rememberBox.checked) localStorage.setItem(SAVED_EMAIL, email);
        else localStorage.removeItem(SAVED_EMAIL);
      } catch { /* localStorage no disponible: no se recuerda y ya está */ }

      // Look up the numeric user id from public.users using company_email
      loginBtn.textContent = 'Buscando usuario...';
      const { data: userData, error: userError } = await supabase
        .from('users')
        .select('id')
        .eq('company_email', data.user.email)
        .single();

      if (userError || !userData) {
        // Fallback: try personal_email
        const { data: userData2, error: userError2 } = await supabase
          .from('users')
          .select('id')
          .eq('personal_email', data.user.email)
          .single();

        if (userError2 || !userData2) {
          showError('Usuario no encontrado en la base de datos. Contacta con el administrador.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Iniciar sesión';
          return;
        }

        ipcRenderer.send('session-ready', {
          authUserId: data.user.id,
          numericUserId: userData2.id,
          email: data.user.email,
          accessToken: data.session.access_token,
          refreshToken: data.session.refresh_token,
        });
        return;
      }

      ipcRenderer.send('session-ready', {
        authUserId: data.user.id,
        numericUserId: userData.id,
        email: data.user.email,
        accessToken: data.session.access_token,
        refreshToken: data.session.refresh_token,
      });
    });

    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
