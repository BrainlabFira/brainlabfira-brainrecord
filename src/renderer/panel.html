<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Brainlabrecord</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      color: #f5f5f5;
    }

    /* La barra arrastrable. Mismo lenguaje glass que el login y el dashboard. */
    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      margin: 8px;
      padding: 0 12px;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      -webkit-app-region: drag;      /* toda la barra mueve la ventana */
      transition: opacity 0.2s;
    }

    /* Minimizado: solo el punto REC, un círculo pequeño. */
    body.mini .bar { justify-content: center; gap: 0; padding: 0; }
    body.mini .only-full { display: none !important; }

    /* Atenuado al autoocultar, para estorbar aún menos. */
    body.dimmed .bar { opacity: 0.35; }

    .rec {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .rec-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70%  { box-shadow: 0 0 0 7px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .rec-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fca5a5;
    }

    .time {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;  /* los dígitos no bailan al cambiar */
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .spacer { flex: 1; }

    .btn {
      -webkit-app-region: no-drag;   /* si no, arrastraría en vez de pulsar */
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
    .btn svg { width: 14px; height: 14px; }
    .btn.stop:hover { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }

    /* Semáforo de subida + barra de nivel de audio, agrupados a la derecha. */
    .meters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-left: 2px;
    }

    .upload-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .upload-dot.uploading { background: #fbbf24; }
    .upload-dot.failing   { background: #ef4444; }

    /* VU: cuatro barritas que suben con el volumen. */
    .vu { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
    .vu span {
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 1px;
      transition: height 0.08s linear, background 0.08s linear;
    }
    .vu span.on { background: #4ade80; }
    /* Micrófono pedido pero no disponible: el nivel sigue moviéndose (hay
       audio de sistema), así que hace falta distinguirlo por color. */
    .vu.mic-off span.on { background: #fbbf24; }

    /* Minimizado: el punto es un BOTÓN no-drag. Antes era un div dentro de la
       barra, que es -webkit-app-region: drag — Windows se tragaba el clic como
       un arrastre y no había forma de volver a expandir el panel. */
    .mini-dot {
      -webkit-app-region: no-drag;
      width: 26px; height: 26px;
      border: none;
      padding: 0;
      border-radius: 50%;
      background: #ef4444;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      animation: pulse 1.6s infinite;
      transition: transform 0.15s, background 0.15s;
    }
    .mini-dot:hover { transform: scale(1.12); background: #f87171; }
    /* Flecha de expandir, visible solo al pasar el ratón: deja claro que el
       punto se puede pulsar. */
    .mini-dot svg {
      width: 12px; height: 12px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .mini-dot:hover svg { opacity: 1; }

    body:not(.mini) .mini-dot { display: none; }
    /* En modo mini la barra deja un borde fino arrastrable alrededor del punto,
       para poder seguir moviendo el panel sin perder el clic de expandir. */
    body.mini .bar { padding: 4px; }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <!-- Minimizado: solo este punto, que es un botón real (no-drag). -->
    <button class="mini-dot" id="miniDot" title="Grabando — clic para volver al panel completo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <div class="rec only-full">
      <div class="rec-dot"></div>
      <span class="rec-label">REC</span>
    </div>

    <div class="time only-full" id="time">00:00:00</div>

    <div class="spacer only-full"></div>

    <div class="meters only-full">
      <div class="upload-dot" id="uploadDot" title="Subida al día"></div>
      <div class="vu" id="vu">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <button class="btn stop only-full" id="stopBtn" title="Terminar grabación (Ctrl + Alt + R)">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>

    <button class="btn only-full" id="miniBtn" title="Minimizar panel (Ctrl + Alt + P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M5 12h14"/>
      </svg>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const EXPANDED = { width: 320, height: 64 };
    const MINI     = { width: 58,  height: 58 };
    const AUTOHIDE_MS = 10_000;

    const body = document.body;
    const timeEl = document.getElementById('time');
    const uploadDot = document.getElementById('uploadDot');
    const vuBars = Array.from(document.querySelectorAll('#vu span'));

    let minimized = false;
    let startedAtMs = 0;
    let isRecording = false;
    let tickTimer = null;
    let autohideTimer = null;

    // ── Tamaño de la ventana ──
    // El main redimensiona la ventana real; el CSS solo cambia el contenido.
    function applySize() {
      const size = minimized ? MINI : EXPANDED;
      ipcRenderer.send('panel:resize', size);
    }

    function setMinimized(value) {
      minimized = value;
      body.classList.toggle('mini', minimized);
      applySize();
      if (minimized) {
        cancelAutohide();     // ya está recogido, no hay nada que atenuar
      } else {
        scheduleAutohide();
      }
    }

    // ── Autoocultar ──
    // Tras 10s sin interacción el panel se atenúa (no se esconde del todo: el
    // empleado debe poder ver siempre que se está grabando). Vuelve al pasar
    // el ratón por encima.
    function scheduleAutohide() {
      cancelAutohide();
      autohideTimer = setTimeout(() => {
        if (!minimized) body.classList.add('dimmed');
      }, AUTOHIDE_MS);
    }

    function cancelAutohide() {
      if (autohideTimer) { clearTimeout(autohideTimer); autohideTimer = null; }
      body.classList.remove('dimmed');
    }

    // mousemove sobre la ventana es la señal fiable de "el ratón está aquí":
    // mouseenter/mouseleave en document no disparan de forma consistente en
    // una ventana transparente sin frame.
    window.addEventListener('mousemove', () => {
      body.classList.remove('dimmed');
      scheduleAutohide();
    });
    window.addEventListener('mouseout', scheduleAutohide);

    // ── Cronómetro ──
    function formatElapsed(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // El cronómetro se calcula desde startedAtMs en cada tick, no sumando 1.
    // Así no se desfasa si el intervalo se retrasa (CPU cargada, suspensión).
    function tick() {
      if (!isRecording || !startedAtMs) return;
      const elapsed = Math.floor((Date.now() - startedAtMs) / 1000);
      timeEl.textContent = formatElapsed(elapsed);
    }

    function startTicking() {
      if (tickTimer) return;
      tick();
      tickTimer = setInterval(tick, 1000);
    }

    function stopTicking() {
      if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    }

    // ── Botones ──
    // No para directamente: pide confirmación. El diálogo lo muestra el
    // dashboard, que es la ventana con sitio para ello.
    document.getElementById('stopBtn').addEventListener('click', () => {
      ipcRenderer.send('recording:request-stop');
    });

    document.getElementById('miniBtn').addEventListener('click', () => {
      setMinimized(true);
    });

    // El punto minimizado es el único control cuando está recogido: clic para
    // volver a la barra completa.
    document.getElementById('miniDot').addEventListener('click', (e) => {
      e.stopPropagation();
      setMinimized(false);
    });

    // Salida de emergencia: doble clic en cualquier punto del panel minimizado
    // lo expande. Si por lo que sea el clic del botón no llega (las ventanas
    // frameless con regiones drag son delicadas en Windows), esto lo salva.
    document.addEventListener('dblclick', () => {
      if (minimized) setMinimized(false);
    });

    // ── Estado desde el main ──
    ipcRenderer.on('recording:status', (_e, status) => {
      isRecording = status.isRecording;
      startedAtMs = status.startedAtMs;

      // Micrófono pedido pero no disponible: se marca el VU en ámbar, porque
      // grabar una reunión sin la voz propia se descubre demasiado tarde.
      const vu = document.getElementById('vu');
      vu.classList.toggle('mic-off', Boolean(status.micUnavailable));
      vu.title = status.micUnavailable
        ? 'Sin micrófono: solo se graba el audio del sistema'
        : 'Nivel de audio';

      if (isRecording) {
        startTicking();
        scheduleAutohide();
      } else {
        stopTicking();
        timeEl.textContent = '00:00:00';
      }
    });

    ipcRenderer.on('upload:status', (_e, status) => {
      uploadDot.classList.remove('uploading', 'failing');
      let tip = 'Subida al día';
      if (status.health === 'uploading') {
        uploadDot.classList.add('uploading');
        tip = `Subiendo ${status.pending + status.uploading} fragmento(s)`;
      } else if (status.health === 'failing') {
        uploadDot.classList.add('failing');
        tip = `Fallo al subir — reintentando ${status.pending} fragmento(s)`;
      }
      uploadDot.title = tip;
    });

    // Nivel de audio: 4 barras que crecen de 3px a 14px.
    ipcRenderer.on('capture:level', (_e, level) => {
      vuBars.forEach((bar, i) => {
        const threshold = (i + 1) / vuBars.length;
        const active = level >= threshold * 0.6;
        bar.classList.toggle('on', active);
        bar.style.height = `${3 + Math.max(0, Math.min(1, level * 1.3)) * (4 + i * 3)}px`;
      });
    });

    // Ctrl+Alt+P alterna minimizado/expandido en vez de esconder el panel:
    // mientras se graba el indicador no debería poder desaparecer del todo.
    ipcRenderer.on('panel:toggle-size', () => { setMinimized(!minimized); });

    // Estado inicial al abrirse (el panel se crea ya grabando).
    (async () => {
      const status = await ipcRenderer.invoke('recording:status');
      isRecording = status.isRecording;
      startedAtMs = status.startedAtMs;
      if (isRecording) startTicking();
      applySize();
      scheduleAutohide();
    })();
  </script>
</body>
</html>
