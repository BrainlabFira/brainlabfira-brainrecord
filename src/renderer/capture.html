<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Brainlabrecord — captura</title>
</head>
<body>
  <!--
    Ventana oculta y permanente: solo motor de captura, sin interfaz.

    Antes esto vivía dentro de login.html, así que el MediaRecorder compartía
    documento con el formulario de acceso. Eso ataba la grabación a una ventana
    que el empleado podía cerrar, y hacía imposible tener un dashboard aparte.
    Aquí nada se muestra ni se cierra mientras la app está viva.
  -->
  <script>
    const { ipcRenderer } = require('electron');
    const fs = require('fs');
    const path = require('path');

    let mediaRecorder = null;
    let recordedChunks = [];
    let currentChunkPath = null;
    let activeStream = null;

    // Medición del nivel de audio para el VU del panel flotante. Sirve para
    // detectar el fallo más caro: grabar una reunión entera en silencio porque
    // el audio del sistema no se estaba captando de verdad.
    let audioContext = null;
    let analyser = null;
    let levelTimer = null;

    const dbg = (m) => ipcRenderer.send('capture-debug', m);

    // Contexto de audio de la mezcla. Se guarda aparte del medidor de nivel
    // porque vive mientras dura el chunk, no solo mientras se mide.
    let mixContext = null;

    // Construye el stream final que graba el MediaRecorder.
    //
    // Cuando hay micrófono, las dos fuentes NO se suman en una sola pista: se
    // reparten por canales.
    //
    //    canal izquierdo  ←  micrófono       (la voz del empleado)
    //    canal derecho    ←  audio del sistema (los demás participantes)
    //
    // El MP4 resultante es estéreo normal y se reproduce igual en cualquier
    // sitio, pero conserva la separación. Una transcripción posterior puede
    // extraer cada canal por separado:
    //
    //    ffmpeg -i grabacion.mp4 -af "pan=mono|c0=c0" empleado.wav
    //    ffmpeg -i grabacion.mp4 -af "pan=mono|c0=c1" remoto.wav
    //
    // Así se sabe quién dice qué sin que el modelo tenga que distinguir las
    // voces de oído, que es la parte que peor funciona de la diarización.
    function buildStream(desktopStream, micStream, config) {
      const videoTracks = desktopStream.getVideoTracks();
      const sysTracks = desktopStream.getAudioTracks();

      // Sin micro (o sin permiso): se graba tal cual venía.
      if (!micStream || micStream.getAudioTracks().length === 0) {
        return desktopStream;
      }

      // Micro sin audio de sistema: la voz sola, sin inventar un canal vacío.
      if (sysTracks.length === 0) {
        return new MediaStream([...videoTracks, ...micStream.getAudioTracks()]);
      }

      try {
        const ctx = new AudioContext();
        mixContext = ctx;

        const micSource = ctx.createMediaStreamSource(micStream);
        const sysSource = ctx.createMediaStreamSource(
          new MediaStream(sysTracks)
        );

        // Cada fuente se colapsa a mono antes de asignarle su canal: si no, el
        // estéreo original del sistema se repartiría entre los dos lados y
        // acabaría contaminando el canal del micrófono.
        const micMono = ctx.createChannelMerger(1);
        const sysMono = ctx.createChannelMerger(1);
        micSource.connect(micMono);
        sysSource.connect(sysMono);

        const merger = ctx.createChannelMerger(2);
        micMono.connect(merger, 0, 0);  // → izquierdo
        sysMono.connect(merger, 0, 1);  // → derecho

        const dest = ctx.createMediaStreamDestination();
        merger.connect(dest);

        dbg('audio mezclado: micro=izquierdo, sistema=derecho');
        return new MediaStream([...videoTracks, ...dest.stream.getAudioTracks()]);
      } catch (err) {
        // Si la mezcla falla, mejor grabar solo el audio del sistema que
        // quedarse sin vídeo.
        dbg('Falló la mezcla de audio, grabando solo el sistema: ' + err.message);
        return desktopStream;
      }
    }

    function startLevelMetering(stream) {
      stopLevelMetering();
      if (stream.getAudioTracks().length === 0) return;

      try {
        audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        const buffer = new Uint8Array(analyser.frequencyBinCount);

        // 10 muestras/s: suficiente para que la barra se vea viva sin castigar
        // la CPU durante horas de grabación.
        levelTimer = setInterval(() => {
          analyser.getByteTimeDomainData(buffer);
          // RMS sobre la desviación respecto al centro (128 = silencio).
          let sum = 0;
          for (let i = 0; i < buffer.length; i++) {
            const d = (buffer[i] - 128) / 128;
            sum += d * d;
          }
          const rms = Math.sqrt(sum / buffer.length);
          // Escala suave: el habla normal queda en una zona visible sin que la
          // barra sature al primer pico.
          const level = Math.min(1, rms * 4);
          ipcRenderer.send('capture-level', level);
        }, 100);
      } catch (err) {
        dbg('No se pudo medir el nivel de audio: ' + err.message);
      }
    }

    function stopLevelMetering() {
      if (levelTimer) { clearInterval(levelTimer); levelTimer = null; }
      if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
      }
      analyser = null;
      ipcRenderer.send('capture-level', 0);
    }

    ipcRenderer.on('start-capture', async (_event, { chunkPath, config }) => {
      currentChunkPath = chunkPath;
      recordedChunks = [];
      dbg('start-capture recibido, pidiendo fuentes...');

      try {
        // desktopCapturer vive en el main process (Electron 17+); pedimos las
        // fuentes por IPC.
        const sources = await ipcRenderer.invoke('get-screen-sources');
        dbg('fuentes recibidas: ' + (sources ? sources.length : 0));

        if (!sources || sources.length === 0) {
          ipcRenderer.send('capture-error', 'No se encontraron fuentes de pantalla');
          return;
        }

        // La fuente elegida en el selector. Si ya no existe (la ventana se
        // cerró entre elegirla y empezar), se aborta en vez de grabar otra
        // cosa sin avisar.
        let sourceId = config.sourceId;
        if (sourceId) {
          if (!sources.some((s) => s.id === sourceId)) {
            ipcRenderer.send('capture-error',
              sourceId.startsWith('window:')
                ? 'La ventana seleccionada se ha cerrado'
                : 'La pantalla seleccionada ya no está disponible');
            return;
          }
        } else {
          sourceId = sources[0].id;
        }

        const constraints = {
          audio: config.captureAudio ? {
            mandatory: { chromeMediaSource: 'desktop' }
          } : false,
          video: {
            mandatory: {
              chromeMediaSource: 'desktop',
              chromeMediaSourceId: sourceId,
              // Una ventana cambia de tamaño mientras se graba, así que no se
              // puede exigir un mínimo: se fija solo el máximo y se deja que
              // la captura se adapte. En una pantalla el tamaño es fijo y sí
              // se puede clavar.
              ...(sourceId.startsWith('window:')
                ? {}
                : { minWidth: config.width, minHeight: config.height }),
              maxWidth: config.width,
              maxHeight: config.height,
              maxFrameRate: config.fps,
            },
          },
        };

        dbg('llamando getUserMedia con sourceId ' + sourceId);
        const desktopStream = await navigator.mediaDevices.getUserMedia(constraints);

        // El micrófono necesita una llamada APARTE: con
        // chromeMediaSource:'desktop' Chromium solo entrega el audio de salida,
        // no se puede pedir el micro en los mismos constraints.
        let micStream = null;
        if (config.captureMic) {
          try {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,   // evita capturar lo que suena por los altavoces
                noiseSuppression: true,
                autoGainControl: true,
              },
            });
            dbg('micrófono abierto: ' + (micStream.getAudioTracks()[0]?.label ?? '?'));
          } catch (micErr) {
            // Sin micrófono se sigue grabando: perder la voz del empleado es
            // malo, pero perder la reunión entera es peor.
            dbg('No se pudo abrir el micrófono: ' + micErr.message);
            ipcRenderer.send('capture-mic-error', micErr.message);
          }
        }

        const stream = buildStream(desktopStream, micStream, config);
        activeStream = stream;
        dbg('stream listo, iniciando MediaRecorder');

        // Bitrate alto para que el webm intermedio no difumine el texto antes de
        // que FFmpeg reencode. ~8 Mbps es generoso para contenido de pantalla a 5fps.
        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'video/webm;codecs=vp9,opus',
          videoBitsPerSecond: 8_000_000,
          audioBitsPerSecond: 128_000,
        });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          blob.arrayBuffer().then((buffer) => {
            fs.mkdirSync(path.dirname(currentChunkPath), { recursive: true });
            fs.writeFileSync(currentChunkPath, Buffer.from(buffer));
            ipcRenderer.send('capture-saved', currentChunkPath);

            // Parar TODAS las fuentes, no solo el stream mezclado: sus pistas
            // son nodos de Web Audio, así que el micrófono real seguiría
            // abierto (y el indicador de Windows encendido) al terminar.
            stream.getTracks().forEach((t) => t.stop());
            desktopStream.getTracks().forEach((t) => t.stop());
            if (micStream) micStream.getTracks().forEach((t) => t.stop());
            if (mixContext) {
              mixContext.close().catch(() => {});
              mixContext = null;
            }
            if (activeStream === stream) activeStream = null;
          });
        };

        mediaRecorder.start(1000); // recoge datos cada segundo
        startLevelMetering(stream);
      } catch (err) {
        ipcRenderer.send('capture-error', err.message);
      }
    });

    ipcRenderer.on('stop-capture', () => {
      stopLevelMetering();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    });
  </script>
</body>
</html>
